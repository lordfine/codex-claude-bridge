<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="834" viewBox="0 0 1600 834"><defs><pattern id="格网" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#DEDCD2" stroke-width="1"/></pattern><marker id="箭头" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#41785D"/></marker></defs><rect width="1600" height="834" fill="#F4F1E9"/><rect width="1600" height="834" fill="url(#格网)" opacity=".28"/><g font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif"><text x="58" y="78" font-size="39" fill="#172F26" font-weight="700" >Two controls. Nine combinations.</text><text x="58" y="122" font-size="25" fill="#65766C" font-weight="400" >Frequency sets handoff boundaries. Reasoning sets the effort for each decision.</text><text x="424" y="196" font-size="29" fill="#172F26" font-weight="700" text-anchor="middle">Low reasoning</text><text x="878" y="196" font-size="29" fill="#172F26" font-weight="700" text-anchor="middle">Medium reasoning</text><text x="1332" y="196" font-size="29" fill="#172F26" font-weight="700" text-anchor="middle">High reasoning</text><text x="54" y="303" font-size="31" fill="#172F26" font-weight="700" >Low</text><rect x="208" y="225" width="428" height="146" rx="14" fill="#FFFEFA" stroke="#DDDCD0" stroke-width="1"/><text x="234" y="284" font-size="31" fill="#172F26" font-weight="700" >Small batch edits</text><text x="234" y="331" font-size="24" fill="#65766C" font-weight="400" >Cost-conscious</text><rect x="662" y="225" width="428" height="146" rx="14" fill="#FFFEFA" stroke="#DDDCD0" stroke-width="1"/><text x="688" y="284" font-size="31" fill="#172F26" font-weight="700" >Routine features</text><text x="688" y="331" font-size="24" fill="#65766C" font-weight="400" >Autonomous execution</text><rect x="1116" y="225" width="428" height="146" rx="14" fill="#FFFEFA" stroke="#DDDCD0" stroke-width="1"/><text x="1142" y="284" font-size="31" fill="#172F26" font-weight="700" >Complex long tasks</text><text x="1142" y="331" font-size="24" fill="#65766C" font-weight="400" >Focused deep review</text><text x="54" y="473" font-size="31" fill="#172F26" font-weight="700" >Medium</text><rect x="208" y="395" width="428" height="146" rx="14" fill="#FFFEFA" stroke="#DDDCD0" stroke-width="1"/><text x="234" y="454" font-size="31" fill="#172F26" font-weight="700" >Simple multi-step work</text><text x="234" y="501" font-size="24" fill="#65766C" font-weight="400" >Milestone feedback</text><rect x="662" y="395" width="428" height="146" rx="14" fill="#172F26" stroke="#41785D" stroke-width="2"/><text x="688" y="454" font-size="31" fill="#FFFEFA" font-weight="700" >Daily development</text><text x="688" y="501" font-size="24" fill="#D6E6D5" font-weight="400" >Default combination</text><text x="1052" y="425" font-size="17" fill="#E9AC88" font-weight="600" text-anchor="end">Default</text><rect x="1116" y="395" width="428" height="146" rx="14" fill="#FFFEFA" stroke="#DDDCD0" stroke-width="1"/><text x="1142" y="454" font-size="31" fill="#172F26" font-weight="700" >Cross-module work</text><text x="1142" y="501" font-size="24" fill="#65766C" font-weight="400" >Key reviews</text><text x="54" y="643" font-size="31" fill="#172F26" font-weight="700" >High</text><rect x="208" y="565" width="428" height="146" rx="14" fill="#FFFEFA" stroke="#DDDCD0" stroke-width="1"/><text x="234" y="624" font-size="31" fill="#172F26" font-weight="700" >Interactive small edits</text><text x="234" y="671" font-size="24" fill="#65766C" font-weight="400" >Quick feedback</text><rect x="662" y="565" width="428" height="146" rx="14" fill="#FFFEFA" stroke="#DDDCD0" stroke-width="1"/><text x="688" y="624" font-size="31" fill="#172F26" font-weight="700" >Exploratory work</text><text x="688" y="671" font-size="24" fill="#65766C" font-weight="400" >Frequent feedback</text><rect x="1116" y="565" width="428" height="146" rx="14" fill="#FFFEFA" stroke="#DDDCD0" stroke-width="1"/><text x="1142" y="624" font-size="31" fill="#172F26" font-weight="700" >Complex debugging</text><text x="1142" y="671" font-size="24" fill="#65766C" font-weight="400" >Deep investigation</text><text x="58" y="787" font-size="24" fill="#65766C" font-weight="400" >Lower effort is not always cheaper. Applied settings depend on the session, version and model.</text><text x="54" y="196" font-size="23" fill="#65766C">Frequency</text></g></svg>
