<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="548" viewBox="0 0 1600 548"><defs><pattern id="格网" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#DEDCD2" stroke-width="1"/></pattern><marker id="箭头" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#41785D"/></marker></defs><rect width="1600" height="548" fill="#F4F1E9"/><rect width="1600" height="548" fill="url(#格网)" opacity=".28"/><g font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif"><text x="56" y="72" font-size="36" fill="#172F26" font-weight="700" >协作怎样推进</text><text x="56" y="113" font-size="25" fill="#65766C" font-weight="400" >你给目标，Codex 安排工作；Claude 交付后，Codex 核对实际结果。</text><rect x="56" y="158" width="350" height="212" rx="16" fill="#172F26" stroke="#DDDCD0"/><text x="80" y="198" font-size="23" fill="#E3A582" font-weight="700" >01</text><text x="80" y="249" font-size="31" fill="#FFFEFA" font-weight="700" >Codex 规划</text><text x="80" y="296" font-size="23" fill="#DAE6D9" font-weight="400" >明确目标与范围</text><text x="80" y="331" font-size="23" fill="#DAE6D9" font-weight="400" >约定交付和检查</text><path d="M414 260H426" fill="none" stroke="#41785D" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#箭头)"/><rect x="434" y="158" width="350" height="212" rx="16" fill="#FFFEFA" stroke="#DDDCD0"/><text x="458" y="198" font-size="23" fill="#CE744B" font-weight="700" >02</text><text x="458" y="249" font-size="31" fill="#172F26" font-weight="700" >Claude 执行</text><text x="458" y="296" font-size="23" fill="#65766C" font-weight="400" >实现并做定向检查</text><text x="458" y="331" font-size="23" fill="#65766C" font-weight="400" >按需委派子代理</text><path d="M792 260H804" fill="none" stroke="#41785D" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#箭头)"/><rect x="812" y="158" width="350" height="212" rx="16" fill="#FFFEFA" stroke="#DDDCD0"/><text x="836" y="198" font-size="23" fill="#CE744B" font-weight="700" >03</text><text x="836" y="249" font-size="31" fill="#172F26" font-weight="700" >阶段交付</text><text x="836" y="296" font-size="23" fill="#65766C" font-weight="400" >结果、版本与检查证据</text><text x="836" y="331" font-size="23" fill="#65766C" font-weight="400" >可安排独立审查</text><path d="M1170 260H1182" fill="none" stroke="#41785D" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#箭头)"/><rect x="1190" y="158" width="350" height="212" rx="16" fill="#172F26" stroke="#DDDCD0"/><text x="1214" y="198" font-size="23" fill="#E3A582" font-weight="700" >04</text><text x="1214" y="249" font-size="31" fill="#FFFEFA" font-weight="700" >Codex 验收</text><text x="1214" y="296" font-size="23" fill="#DAE6D9" font-weight="400" >核对要求与实际改动</text><text x="1214" y="331" font-size="23" fill="#DAE6D9" font-weight="400" >继续、修复或完成</text><path d="M1364 390V439H608V390" fill="none" stroke="#41785D" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#箭头)"/><rect x="716" y="421" width="530" height="38" rx="0" fill="#F4F1E9" /><text x="980" y="448" font-size="24" fill="#41785D" font-weight="600" text-anchor="middle">验收有问题 → 明确反馈，再定向修复</text><text x="56" y="506" font-size="23" fill="#65766C" font-weight="400" >收尾：有复用价值则保留；确认无复用价值的自建会话、工作树与分支按条件清理。</text></g></svg>
