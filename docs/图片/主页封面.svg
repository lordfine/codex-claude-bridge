<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="720" viewBox="0 0 1600 720"><defs><pattern id="格网" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#DEDCD2" stroke-width="1"/></pattern><marker id="箭头" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#41785D"/></marker></defs><rect width="1600" height="720" fill="#F4F1E9"/><rect width="1600" height="720" fill="url(#格网)" opacity=".28"/><g font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif"><rect x="0" y="0" width="10" height="720" rx="0" fill="#CE744B" /><text x="64" y="76" font-size="30" fill="#172F26" font-weight="700" >Codex × Claude Bridge</text><text x="64" y="178" font-size="66" fill="#172F26" font-weight="700" >让 Codex 指挥，</text><text x="64" y="260" font-size="66" fill="#172F26" font-weight="700" >让 Claude Code 执行。</text><text x="66" y="324" font-size="25" fill="#65766C" font-weight="400" >任务分派、阶段交付、审查验收，接成一条工作流。</text><path d="M66 372H752" fill="none" stroke="#DDDCD0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><text x="66" y="428" font-size="29" fill="#172F26" font-weight="700" >什么时候介入 × 每次投入多少思考</text><text x="66" y="472" font-size="25" fill="#65766C" font-weight="400" >频率与思考分别三档，按任务组合。</text><rect x="66" y="526" width="196" height="44" rx="22" fill="#E4ECE2" /><text x="164" y="555" font-size="21" fill="#172F26" font-weight="600" text-anchor="middle">普通终端可用</text><rect x="278" y="526" width="148" height="44" rx="22" fill="#E4ECE2" /><text x="352" y="555" font-size="21" fill="#172F26" font-weight="600" text-anchor="middle">Orca 可选</text><rect x="442" y="526" width="224" height="44" rx="22" fill="#E4ECE2" /><text x="554" y="555" font-size="21" fill="#172F26" font-weight="600" text-anchor="middle">Windows / macOS</text><text x="66" y="654" font-size="23" fill="#65766C" font-weight="400" >沿用当前模型配置 · 过程可见 · 结果可核对</text><rect x="862" y="58" width="672" height="604" rx="24" fill="#FFFEFA" stroke="#DDDCD0"/><text x="896" y="112" font-size="28" fill="#172F26" font-weight="700" >从目标，到可验收的交付</text><rect x="896" y="152" width="260" height="178" rx="18" fill="#172F26" /><text x="922" y="203" font-size="33" fill="#FFFEFA" font-weight="700" >Codex</text><text x="922" y="249" font-size="23" fill="#E0EADF" font-weight="400" >规划 · 决策 · 验收</text><path d="M922 279H1126" fill="none" stroke="#5D7967" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" /><rect x="1230" y="152" width="270" height="178" rx="18" fill="#E4ECE2" /><text x="1252" y="203" font-size="30" fill="#172F26" font-weight="700" >Claude Code</text><text x="1252" y="249" font-size="23" fill="#41785D" font-weight="400" >实现 · 检查 · 回传</text><path d="M1254 279H1474" fill="none" stroke="#BED0BD" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" /><path d="M1166 205H1218" fill="none" stroke="#CE744B" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><path d="M1208 195L1218 205L1208 215" fill="none" stroke="#CE744B" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><text x="1193" y="180" font-size="18" fill="#65766C" font-weight="500" text-anchor="middle">派单</text><path d="M1218 282H1166" fill="none" stroke="#41785D" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><path d="M1176 272L1166 282L1176 292" fill="none" stroke="#41785D" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><text x="1193" y="313" font-size="18" fill="#65766C" font-weight="500" text-anchor="middle">交付</text><rect x="896" y="370" width="604" height="90" rx="14" fill="#F1F2E9" /><text x="920" y="407" font-size="25" fill="#172F26" font-weight="700" >本地桥接器</text><text x="920" y="439" font-size="22" fill="#65766C" font-weight="400" >管理会话、保存证据、按事件接续</text><text x="900" y="511" font-size="23" fill="#172F26" font-weight="600" >明确任务</text><text x="1100" y="511" font-size="23" fill="#172F26" font-weight="600" >独立执行</text><text x="1320" y="511" font-size="23" fill="#172F26" font-weight="600" >实际验收</text><path d="M1020 503H1080" fill="none" stroke="#41785D" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><path d="M1226 503H1300" fill="none" stroke="#41785D" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><text x="900" y="582" font-size="23" fill="#65766C" font-weight="400" >普通进展留在本地，交付与异常进入主控。</text></g></svg>
