<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="548" viewBox="0 0 1600 548"><defs><pattern id="格网" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#DEDCD2" stroke-width="1"/></pattern><marker id="箭头" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#41785D"/></marker></defs><rect width="1600" height="548" fill="#F4F1E9"/><rect width="1600" height="548" fill="url(#格网)" opacity=".28"/><g font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif"><text x="56" y="72" font-size="36" fill="#172F26" font-weight="700" >How collaboration moves forward</text><text x="56" y="113" font-size="25" fill="#65766C" font-weight="400" >Set a goal. Codex delegates. Claude reports. Codex verifies the result.</text><rect x="56" y="158" width="350" height="212" rx="16" fill="#172F26" stroke="#DDDCD0"/><text x="80" y="198" font-size="23" fill="#E3A582" font-weight="700" >01</text><text x="80" y="249" font-size="31" fill="#FFFEFA" font-weight="700" >Codex plans</text><text x="80" y="296" font-size="23" fill="#DAE6D9" font-weight="400" >Goal and scope</text><text x="80" y="331" font-size="23" fill="#DAE6D9" font-weight="400" >Acceptance and checks</text><path d="M414 260H426" fill="none" stroke="#41785D" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#箭头)"/><rect x="434" y="158" width="350" height="212" rx="16" fill="#FFFEFA" stroke="#DDDCD0"/><text x="458" y="198" font-size="23" fill="#CE744B" font-weight="700" >02</text><text x="458" y="249" font-size="31" fill="#172F26" font-weight="700" >Claude builds</text><text x="458" y="296" font-size="23" fill="#65766C" font-weight="400" >Implement and check</text><text x="458" y="331" font-size="23" fill="#65766C" font-weight="400" >Delegate scoped subtasks</text><path d="M792 260H804" fill="none" stroke="#41785D" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#箭头)"/><rect x="812" y="158" width="350" height="212" rx="16" fill="#FFFEFA" stroke="#DDDCD0"/><text x="836" y="198" font-size="23" fill="#CE744B" font-weight="700" >03</text><text x="836" y="249" font-size="31" fill="#172F26" font-weight="700" >Claude reports</text><text x="836" y="296" font-size="23" fill="#65766C" font-weight="400" >Result, revision and evidence</text><text x="836" y="331" font-size="23" fill="#65766C" font-weight="400" >Optional independent review</text><path d="M1170 260H1182" fill="none" stroke="#41785D" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#箭头)"/><rect x="1190" y="158" width="350" height="212" rx="16" fill="#172F26" stroke="#DDDCD0"/><text x="1214" y="198" font-size="23" fill="#E3A582" font-weight="700" >04</text><text x="1214" y="249" font-size="31" fill="#FFFEFA" font-weight="700" >Codex verifies</text><text x="1214" y="296" font-size="23" fill="#DAE6D9" font-weight="400" >Verify actual changes</text><text x="1214" y="331" font-size="23" fill="#DAE6D9" font-weight="400" >Continue, revise or finish</text><path d="M1364 390V439H608V390" fill="none" stroke="#41785D" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#箭头)"/><rect x="650" y="421" width="658" height="38" rx="0" fill="#F4F1E9" /><text x="980" y="448" font-size="24" fill="#41785D" font-weight="600" text-anchor="middle">Issues → Specific feedback, targeted fixes</text><text x="56" y="506" font-size="23" fill="#65766C" font-weight="400" >Clean up non-reusable sessions, owned worktrees and branches after verifying results.</text></g></svg>
